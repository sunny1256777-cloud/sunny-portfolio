    <script>
      (function() {
        try {
          var saved = localStorage.getItem("theme:v1");
          var sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var theme = saved || sys;
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
